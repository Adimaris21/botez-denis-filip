<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botez Denis Filip - Galerie</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            text-align: center; 
            padding: 20px 10px; 
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%); 
            color: #334155; 
            min-height: 100vh;
            margin: 0;
        }
        .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 30px 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            backdrop-filter: blur(10px);
        }
        h1 { font-size: 28px; color: #0284c7; margin-bottom: 5px; font-weight: 800; }
        .subtitle { color: #64748b; font-size: 16px; margin-top: 0; margin-bottom: 15px; }
        
        /* Caseta cu informații despre memorie */
        .storage-info {
            background: #f0f9ff;
            border: 1px solid #bae6fd;
            color: #0369a1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
            display: inline-block;
            line-height: 1.5;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.05);
        }
        .storage-info span { font-weight: 800; color: #0284c7; }

        .upload-section { 
            background: #f8fafc; 
            border: 2px dashed #7dd3fc; 
            padding: 25px 15px; 
            border-radius: 15px; 
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }
        .upload-section:hover { border-color: #0ea5e9; background: #f0f9ff; }
        
        input[type="file"] { margin: 10px 0 20px 0; width: 100%; max-width: 300px; }
        input[type="file"]::file-selector-button {
            background: #e0f2fe; border: 1px solid #bae6fd; padding: 8px 15px;
            border-radius: 8px; color: #0284c7; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        input[type="file"]::file-selector-button:hover { background: #bae6fd; }

        #uploadBtn { 
            background: #0ea5e9; color: white; border: none; padding: 14px 30px; 
            border-radius: 25px; cursor: pointer; font-weight: 800; font-size: 16px; 
            width: 100%; max-width: 300px; font-family: 'Nunito', sans-serif;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
            transition: all 0.3s ease;
        }
        #uploadBtn:hover { background: #0284c7; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(14, 165, 233, 0.6); }
        #uploadBtn:disabled { background: #cbd5e1; box-shadow: none; transform: none; cursor: not-allowed; }
        
        /* Galerie */
        h2 { color: #0f172a; font-weight: 800; margin-bottom: 20px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .gallery-item { 
            position: relative; border-radius: 12px; overflow: hidden; 
            background: #f1f5f9; aspect-ratio: 1 / 1; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .gallery-item:hover { transform: scale(1.03); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .gallery-item img, .gallery-item video { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .download-btn { 
            position: absolute; bottom: 8px; right: 8px; 
            background: rgba(255, 255, 255, 0.9); color: #0284c7; 
            padding: 6px 12px; border-radius: 20px; text-decoration: none; 
            font-size: 12px; font-weight: bold; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }
        .download-btn:hover { background: #0ea5e9; color: white; }
        
        progress { width: 100%; height: 10px; margin-top: 15px; border-radius: 10px; overflow: hidden; display: none; }
        progress::-webkit-progress-bar { background-color: #e2e8f0; }
        progress::-webkit-progress-value { background-color: #0ea5e9; }
        
        #status { margin-top: 15px; font-size: 15px; font-weight: bold; color: #10b981; }
        .empty-gallery { color: #94a3b8; font-style: italic; padding: 20px; grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="container">
    <h1>Amintiri Botez Denis Filip 👼</h1>
    <p class="subtitle">Adaugă și tu pozele tale în albumul nostru digital!</p>

    <!-- Caseta unde va apărea memoria calculată -->
    <div id="storageInfo" class="storage-info">
        ⏳ Se calculează memoria disponibilă...
    </div>
    
    <div class="upload-section">
        <p style="margin-top: 0; font-weight: 600;">Selectează poze sau clipuri video:</p>
        <input type="file" id="fileInput" multiple accept="image/*,video/*">
        <br>
        <button id="uploadBtn">Încarcă în Galerie</button>
        <progress id="progressBar" value="0" max="100"></progress>
        <div id="status"></div>
    </div>

    <h2>Galerie Foto & Video 📸</h2>
    <div class="gallery" id="gallery">
        <p class="empty-gallery">Se încarcă pozele...</p>
    </div>
</div>

<script type="module">
    // Am importat și funcția getMetadata necesară pentru a afla dimensiunea
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable, listAll, getDownloadURL, getMetadata } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBLZeak1UFDcfj8BcYKoOJUAjmM4b4EJ7o",
      authDomain: "botez-denis-filip.firebaseapp.com",
      projectId: "botez-denis-filip",
      storageBucket: "botez-denis-filip.firebasestorage.app",
      messagingSenderId: "748700570580",
      appId: "1:748700570580:web:eb33cf60eb7ef9f99cbc41",
      measurementId: "G-XFCZLZG8BC"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);
    const galleryDiv = document.getElementById('gallery');
    const storageInfoDiv = document.getElementById('storageInfo');

    // Funcție pentru a calcula dimensiunea tuturor fișierelor
    async function updateStorageUsage(items) {
        if (items.length === 0) {
            storageInfoDiv.innerHTML = "💾 Spațiu ocupat: <span>0 MB</span> din <span>5 GB</span> (0%) <br> 📸 Fișiere încărcate: <span>0</span>";
            return;
        }

        try {
            let totalBytesUsed = 0;
            // Luăm detaliile pentru fiecare fișier în parte
            const metadataPromises = items.map(item => getMetadata(item));
            const metadatas = await Promise.all(metadataPromises);
            
            metadatas.forEach(meta => {
                totalBytesUsed += meta.size;
            });

            // Transformăm în MB și calculăm procentul (5GB = 5120MB)
            const usedMB = (totalBytesUsed / (1024 * 1024)).toFixed(1);
            const percentage = ((totalBytesUsed / (5 * 1024 * 1024 * 1024)) * 100).toFixed(2);

            storageInfoDiv.innerHTML = `💾 Spațiu ocupat: <span>${usedMB} MB</span> din <span>5 GB</span> (${percentage}%) <br> 📸 Fișiere încărcate: <span>${items.length}</span>`;
        } catch (error) {
            console.error("Eroare la calcul memorie:", error);
            storageInfoDiv.innerHTML = "Memorie disponibilă: 5 GB (Eroare la calculare exactă)";
        }
    }

    // Afișare galerie
    async function loadGallery() {
        const listRef = ref(storage, 'botez_media/');
        try {
            const res = await listAll(listRef);
            
            // Pornim calculul memoriei în fundal
            updateStorageUsage(res.items);

            if (res.items.length === 0) {
                galleryDiv.innerHTML = "<p class='empty-gallery'>Fii primul care încarcă o amintire! 🤍</p>";
                return;
            }
            galleryDiv.innerHTML = "";
            for (const itemRef of res.items) {
                const url = await getDownloadURL(itemRef);
                const itemDiv = document.createElement('div');
                itemDiv.className = 'gallery-item';
                
                const isVideo = itemRef.name.toLowerCase().match(/\.(mp4|mov|webm)$/);
                if (isVideo) {
                    itemDiv.innerHTML = `<video src="${url}" controls></video>`;
                } else {
                    itemDiv.innerHTML = `<img src="${url}" loading="lazy">`;
                }

                const dLink = document.createElement('a');
                dLink.href = url;
                dLink.target = "_blank";
                dLink.download = itemRef.name;
                dLink.className = "download-btn";
                dLink.innerText = "Descarcă";
                itemDiv.appendChild(dLink);
                galleryDiv.appendChild(itemDiv);
            }
        } catch (e) { 
            console.error(e); 
            galleryDiv.innerHTML = "<p class='empty-gallery'>Eroare la afișare. Asigură-te că regulile Firebase permit citirea.</p>";
        }
    }

    loadGallery();

    // Logica de Încărcare
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressBar = document.getElementById('progressBar');
    const statusDiv = document.getElementById('status');

    uploadBtn.addEventListener('click', async () => {
        const files = fileInput.files;
        if (files.length === 0) return alert("Selectează cel puțin un fișier!");

        uploadBtn.disabled = true;
        progressBar.style.display = 'block';
        statusDiv.innerText = "Se încarcă...";

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const storageRef = ref(storage, `botez_media/${Date.now()}_${file.name}`);
            const uploadTask = uploadBytesResumable(storageRef, file);

            await new Promise((resolve) => {
                uploadTask.on('state_changed', 
                    (snap) => { progressBar.value = (snap.bytesTransferred / snap.totalBytes) * 100; },
                    () => resolve(),
                    () => resolve()
                );
            });
        }

        statusDiv.innerText = "Încărcare reușită! 🎉 Mulțumim!";
        progressBar.style.display = 'none';
        uploadBtn.disabled = false;
        fileInput.value = "";
        
        // După ce termină de încărcat poze noi, se reîncarcă galeria și se recalculează memoria
        storageInfoDiv.innerHTML = "⏳ Se recalculează memoria...";
        loadGallery();
    });
</script>

</body>
</html>
