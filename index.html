<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poze Botez Denis Filip</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background-color: #f8f9fa; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; font-size: 24px; }
        input[type="file"] { margin: 20px 0; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        progress { width: 100%; height: 20px; margin-top: 15px; display: none; }
        #status { margin-top: 15px; font-weight: bold; color: green; }
    </style>
</head>
<body>

<div class="container">
    <h1>Încarcă amintirile cu Denis Filip 📸</h1>
    <p>Selectează pozele sau clipurile video de la botez:</p>
    
    <!-- Permitem selecția multiplă de imagini și video -->
    <input type="file" id="fileInput" multiple accept="image/*,video/*">
    <br>
    <button id="uploadBtn">Încarcă Fișierele</button>
    
    <progress id="progressBar" value="0" max="100"></progress>
    <div id="status"></div>
</div>

<!-- Folosim SDK-ul Firebase modular prin CDN -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getStorage, ref, uploadBytesResumable } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-storage.js";

    // INSEREAZĂ AICI DATELE TALE DIN FIREBASE CONSOLE (Pasul 1)
    const firebaseConfig = {
      apiKey: "AIzaSyBLZeak1UFDcfj8BcYKoOJUAjmM4b4EJ7o",
      authDomain: "botez-denis-filip.firebaseapp.com",
      projectId: "botez-denis-filip",
      storageBucket: "botez-denis-filip.firebasestorage.app",
      messagingSenderId: "748700570580",
      appId: "1:748700570580:web:eb33cf60eb7ef9f99cbc41"
      measurementId: "G-XFCZLZG8BC"
    };

    const app = initializeApp(firebaseConfig);
    const storage = getStorage(app);

    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const progressBar = document.getElementById('progressBar');
    const statusDiv = document.getElementById('status');

    uploadBtn.addEventListener('click', async () => {
        const files = fileInput.files;
        if (files.length === 0) {
            alert("Te rog selectează cel puțin un fișier!");
            return;
        }

        uploadBtn.disabled = true;
        progressBar.style.display = 'block';
        statusDiv.innerText = `Se încarcă 0 din ${files.length} fișiere...`;

        let uploadedCount = 0;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            // Generăm un nume unic pentru a nu suprascrie fișierele cu același nume (ex: image.jpg)
            const uniqueFileName = `${Date.now()}_${file.name}`;
            const storageRef = ref(storage, `botez_media/${uniqueFileName}`);
            
            const uploadTask = uploadBytesResumable(storageRef, file);

            // Așteptăm ca fiecare fișier să se încarce
            await new Promise((resolve, reject) => {
                uploadTask.on('state_changed', 
                    (snapshot) => {
                        const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                        progressBar.value = progress;
                    }, 
                    (error) => {
                        console.error("Eroare la încărcare:", error);
                        reject(error);
                    }, 
                    () => {
                        uploadedCount++;
                        statusDiv.innerText = `S-au încărcat ${uploadedCount} din ${files.length} fișiere.`;
                        resolve();
                    }
                );
            });
        }

        statusDiv.innerText = "Toate fișierele au fost încărcate cu succes! 🎉";
        progressBar.style.display = 'none';
        uploadBtn.disabled = false;
        fileInput.value = ""; // Resetăm input-ul
    });
</script>

</body>
</html>
